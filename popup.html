<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X屏蔽词助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>X屏蔽词助手</h1>
      <p>帮你把常见广告和引流词添加到 X 的屏蔽词。</p>
      <button id="open-settings" type="button">开始屏蔽</button>
      <p class="hint">点击后打开 X 设置页，再按页面提示完成添加。</p>
      <details>
        <summary>添加自定义屏蔽词</summary>
        <div class="custom-entry">
          <input
            id="custom-word"
            type="text"
            placeholder="输入一个词，例如：某品牌"
            maxlength="100"
          />
          <button id="add-custom-word" class="secondary" type="button">
            添加
          </button>
        </div>
        <span id="custom-status" class="status" role="status"></span>
      </details>
      <p class="privacy">数据只保存在本机，不读取或上传 Cookie。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
