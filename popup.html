<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>清净词｜X 屏蔽词助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>屏蔽骚扰词</h1>
      <p>帮你把常见广告和引流词添加到 X 的屏蔽词。</p>
      <button id="open-settings" type="button">开始添加</button>
      <p class="hint">点击后打开 X 设置页，再按页面提示完成添加。</p>
      <details>
        <summary>高级设置</summary>
        <button id="edit-pack" class="secondary" type="button">
          编辑自定义词
        </button>
        <span id="pack-status" class="status" role="status"></span>
      </details>
      <textarea id="words" hidden placeholder="每行一个词"></textarea>
      <div id="editor-actions" hidden>
        <button id="save-pack" type="button">保存词包</button>
        <span id="save-status"></span>
      </div>
      <p class="privacy">数据只保存在本机，不读取或上传 Cookie。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
